version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/artifacts
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/rewind.db
      - ARTIFACTS_DIR=/app/artifacts
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://frontend:80
      - LOG_LEVEL=INFO
      # No display and no Google Chrome inside the image: headless Chromium only.
      - HEADLESS=true
      - BROWSER_CHANNEL=
      - SLOW_MO_MS=0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://backend:8000

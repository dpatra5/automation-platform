<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewind</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px; padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff; color: #1e293b;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .mark { width: 22px; height: 22px; border-radius: 7px; background: #4338ca; display: grid; place-items: center; color: #fff; font-size: 11px; }
    .header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .status {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 13px; border-radius: 12px; margin-bottom: 14px;
      font-size: 13px; font-weight: 600;
    }
    .recording { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .paused    { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .saving    { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .idle      { background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot.recording { background: #ef4444; animation: pulse 1.5s infinite; }
    .dot.paused { background: #d97706; }
    .dot.saving { background: #2563eb; }
    .dot.idle { background: #94a3b8; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .stats { display: flex; gap: 10px; margin-bottom: 14px; }
    .stat { flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; text-align: center; }
    .stat .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; margin-top: 2px; }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1; padding: 10px; border: 1px solid transparent; border-radius: 10px;
      cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit;
      transition: background 120ms ease;
    }
    .stop-btn { background: #ef4444; color: #fff; }
    .stop-btn:hover:not(:disabled) { background: #dc2626; }
    .pause-btn { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .pause-btn:hover:not(:disabled) { background: #e2e8f0; }
    button:disabled { opacity: 0.55; cursor: default; }
    .info { font-size: 11px; color: #64748b; margin-top: 14px; text-align: center; line-height: 1.55; }
    .error { color: #b91c1c; font-size: 12px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <span class="mark">&#9654;</span>
    <h1>Rewind</h1>
  </div>

  <div id="status" class="status idle">
    <span class="dot idle" id="dot"></span>
    <span id="statusText">Not recording</span>
  </div>

  <div id="stepInfo" class="stats" style="display:none">
    <div class="stat"><div class="value" id="stepCount">0</div><div class="label">Steps</div></div>
    <div class="stat"><div class="value" id="elapsed">0:00</div><div class="label">Elapsed</div></div>
  </div>

  <div class="row" id="controls" style="display:none">
    <button id="pauseBtn" class="pause-btn" type="button">Pause</button>
    <button id="stopBtn" class="stop-btn" type="button">Stop</button>
  </div>

  <div id="errorMsg" class="error" style="display:none"></div>
  <p class="info">The recorder bar sits at the bottom of the page you are recording. Start a session from the Rewind dashboard.</p>
  <script type="module" src="./popup.ts"></script>
</body>
</html>

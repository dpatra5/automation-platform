[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apitest"
version = "0.1.0"
description = "API Testing Tool: collections, assertions, chaining, data-driven runs and reports."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apitest = "apitest.__main__:main"

[tool.setuptools.packages.find]
include = ["apitest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
